[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casino-monitor"
version = "0.1.0"
description = "Pragmatic Play Live Baccarat Real-Time Monitoring Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
    "python-socks[asyncio]>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.40.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["."]
