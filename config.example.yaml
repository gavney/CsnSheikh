connection:
  heartbeat_interval_sec: 10.0
  watchdog_timeout_sec: 15.0
  reconnect_min_delay_sec: 1.0
  reconnect_max_delay_sec: 60.0
  reconnect_jitter_sec: 0.5
  stagger_delay_sec: 2.0
  max_reconnect_attempts: 10

session:
  provider: env   # env | playwright
  browser_profile_dir: ./browser_profile
  auto_refresh_on_auth_error: true
  proactive_refresh_interval_sec: 1800  # Фоновое автообновление токена каждые 30 минут (0 = выключено)

storage:
  database_path: ./casino_monitor.db
  window_size: 200

rules:
  - id: player_streak_4
    name: "Игрок 4 победы подряд"
    enabled: true
    tables: all
    perspective: player        # player | banker
    tie_policy: ignore         # ignore | break | count_as_loss
    reset_on_shoe: true
    condition: { type: streak, of: player, window: 30 }
    levels:
      - { at: 4, actions: [telegram] }
    rearm: on_break
    notify_on_end: false
